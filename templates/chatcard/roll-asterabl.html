<div class="aster-chat-card">
  <header class="card-header">
    <div class="title">
      <div class="name">{{label}} 판정</div>
      <div class="formula">DC {{rollDC}}</div>
    </div>
  </header>

  <div class="roll-block">
    <div class="dice">[{{diceText}}] + {{ablValue}}</div>
    <div class="breakdown">{{result}} &ge; {{rollDC}}</div>
    <div class="verdict {{#if isSuccess}}success{{else}}fail{{/if}}">
      {{#if isSpecial}}스페셜{{else}}{{#if isSuccess}}성공{{else}}실패{{/if}}{{/if}}
    </div>
  </div>
</div>
