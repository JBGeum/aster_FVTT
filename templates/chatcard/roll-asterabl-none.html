<div class="chatcard aster-dicecard text-align">
  <div class="roll-abl-chatcard">
    <div class="roll-title">
      <div class="chatcard-abl-name flex-center">{{label}} 판정</div>
    </div>
    <div class="diceset-area flexrow align-center">
      {{#each resultDiceset}}
      <div class="die-result flexcol">
        <div class="die-area">
          <i class="dNum-{{this}} fa-duotone fa-square-{{this}}"></i>
        </div>
      </div>
      {{/each}}
      <div class="die-result flexcol">
        <div class="die-area">
          <i class="dNum-{{ablValue}} fa-duotone fa-square-{{ablValue}}"></i>
        </div>
      </div>
    </div>
    <div class="roll-dc">
      <label class="roll-dc-lbl">결과</label>
      {{result}}
      =
      {{total}}
    </div>
  </div>
</div>
