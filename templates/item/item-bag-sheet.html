<form class="aster {{cssClass}}" autocomplete="off">
  <div class="herbarium">
    <div class="dialog__body">
      <div class="frow dlg-name">
        <label>{{localize "ASTER.item.name"}}</label>
        <div class="f-input">
          <input
            type="text"
            name="name"
            value="{{item.name}}"
            placeholder="{{localize 'ASTER.item.namePlaceholder'}}"
          />
        </div>
      </div>
      <div class="dialog__hero">
        <div class="thumb pixelart"><img src="{{item.img}}" data-edit="img" title="{{item.name}}" /></div>
        <div class="hero-fields">
          <div class="frow">
            <label>{{localize "ASTER.item.gridSize"}}</label>
            <div class="size-row">
              <div class="pair">
                <span class="k">{{localize "ASTER.item.cols"}}</span
                ><input class="box" type="number" name="system.grid.cols" value="{{system.grid.cols}}" min="1" />
              </div>
              <div class="pair">
                <span class="k">{{localize "ASTER.item.rows"}}</span
                ><input class="box" type="number" name="system.grid.rows" value="{{system.grid.rows}}" min="1" />
              </div>
            </div>
          </div>
          <div class="frow">
            <label>{{localize "ASTER.item.requirement"}}</label>
            <div class="f-input"><input type="text" name="system.requirement" value="{{system.requirement}}" /></div>
          </div>
        </div>
      </div>

      <div class="frow frow--stack">
        <label>{{localize "ASTER.item.material.title"}}</label>
        {{> "systems/aster/templates/item/parts/material-mats.html"}}
      </div>
      <div class="frow frow--stack">
        <label>{{localize "ASTER.item.effect"}}</label>
        <div class="f-area"><textarea name="system.effect">{{system.effect}}</textarea></div>
      </div>
      <div class="frow">
        <label>{{localize "ASTER.item.storageImg"}}</label>
        <div class="thumb pixelart"><img src="{{system.storageImg}}" data-edit="system.storageImg" /></div>
      </div>

      <div class="frow frow--stack">
        <label>{{localize "ASTER.item.description"}}</label>
        <div class="f-area">
          {{editor system.description target="system.description" button=true editable=editable}}
        </div>
      </div>
    </div>
  </div>
</form>
