<form class="aster {{cssClass}}" autocomplete="off">
  <div class="herbarium">
    <div class="dialog__body">
      <div class="dialog__hero">
        <div class="thumb"><img src="{{item.img}}" data-edit="img" title="{{item.name}}" /></div>
        <div class="hero-fields">
          <div class="frow">
            <label>이름</label>
            <div class="f-input">
              <input
                type="text"
                name="name"
                value="{{item.name}}"
                placeholder="{{localize 'ASTER.item.namePlaceholder'}}"
              />
            </div>
          </div>
          <div class="frow">
            <label>{{localize "ASTER.food.restore"}}</label>
            <div class="f-input"><input type="number" name="system.restore" value="{{system.restore}}" min="0" /></div>
          </div>
          <div class="frow">
            <label>요구</label>
            <div class="f-input"><input type="text" name="system.requirement" value="{{system.requirement}}" /></div>
          </div>
        </div>
      </div>

      <div class="frow frow--stack">
        <label>재료</label>
        {{> "systems/aster/templates/item/parts/material-mats.html"}}
      </div>
      <div class="frow frow--stack">
        <label>{{localize "ASTER.food.bonusEffect"}}</label>
        <div class="f-area"><textarea name="system.bonusEffect">{{system.bonusEffect}}</textarea></div>
      </div>
      <div class="frow frow--stack">
        <label>효과</label>
        <div class="f-area"><textarea name="system.effect">{{system.effect}}</textarea></div>
      </div>
      <p class="fnote">{{localize "ASTER.food.bonusEffectHint"}}</p>

      <div class="frow frow--stack">
        <label>설명</label>
        <div class="f-area">
          {{editor system.description target="system.description" button=true editable=editable}}
        </div>
      </div>
    </div>
  </div>
</form>
