<form class="aster {{cssClass}}" autocomplete="off">
  <div class="herbarium">
    <div class="dialog__body">
      <div class="frow dlg-name">
        <label>이름</label>
        <div class="f-input">
          <input
            type="text"
            name="name"
            value="{{item.name}}"
            placeholder="{{localize 'ASTER.npcAction.namePlaceholder'}}"
          />
        </div>
      </div>
      <div class="dialog__hero">
        <div class="thumb pixelart"><img src="{{item.img}}" data-edit="img" title="{{item.name}}" /></div>
        <div class="hero-fields">
          <div class="frow">
            <label>{{localize "ASTER.npcAction.targetType"}}</label>
            <div class="f-select">
              <select name="system.targetType">
                {{selectOptions config.npcTargetType selected=system.targetType localize=true}}
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="frow">
        <label>{{localize "ASTER.npcAction.cost"}}</label>
        <div class="f-inline">
          <div class="f-input">
            <input type="number" name="system.cost" value="{{system.cost}}" min="0" {{disabled system.costVariable}} />
          </div>
          <label class="toggle">
            <input type="checkbox" name="system.costVariable" {{checked system.costVariable}} />
            <span class="box">✓</span>{{localize "ASTER.npcAction.costVariable"}}
          </label>
        </div>
      </div>
      <div class="frow">
        <label>{{localize "ASTER.npcAction.damageFormula"}}</label>
        <div class="f-inline">
          <div class="f-input">
            <input type="text" name="system.damageFormula" value="{{system.damageFormula}}" placeholder="3D6+4" />
          </div>
          <label class="toggle">
            <input type="checkbox" name="system.oncePerRound" {{checked system.oncePerRound}} />
            <span class="box">✓</span>{{localize "ASTER.npcAction.oncePerRound"}}
          </label>
        </div>
      </div>

      <div class="frow frow--stack">
        <label>{{localize "ASTER.npcAction.addStatus"}}</label>
        <div class="chk-group">
          {{#each addStatusOptions as |opt|}}
          <label class="chk">
            <input type="checkbox" class="npcaction-add-status" data-status="{{opt.key}}" {{checked opt.checked}} />
            <span class="box">✓</span>{{opt.label}}
          </label>
          {{/each}}
        </div>
      </div>

      <div class="frow frow--stack">
        <label>{{localize "ASTER.npcAction.cureStatus"}}</label>
        <label class="toggle">
          <input type="checkbox" name="system.cureAllStatus" {{checked system.cureAllStatus}} />
          <span class="box">✓</span>{{localize "ASTER.npcAction.cureAllStatus"}}
        </label>
        <div class="chk-group">
          {{#each cureStatusOptions as |opt|}}
          <label class="chk">
            <input
              type="checkbox"
              class="npcaction-cure-status"
              data-status="{{opt.key}}"
              {{checked
              opt.checked}}
              {{disabled
              system.cureAllStatus}}
            />
            <span class="box">✓</span>{{opt.label}}
          </label>
          {{/each}}
        </div>
      </div>

      <div class="frow frow--stack">
        <label>{{localize "ASTER.npcAction.effect"}}</label>
        <div class="f-area">
          <textarea name="system.effect" placeholder="{{localize 'ASTER.npcAction.effectPlaceholder'}}">
{{system.effect}}</textarea
          >
        </div>
      </div>
      <div class="frow frow--stack">
        <label>설명</label>
        <div class="f-area">
          {{editor system.description target="system.description" button=true editable=editable}}
        </div>
      </div>
    </div>
  </div>
</form>
