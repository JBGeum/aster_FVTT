<section class="panel panel--identity" data-corner="✿">
  <div class="identity">
    <div class="id-row">
      <div class="field field--name">
        <label>{{localize "ASTER.label.name"}}</label>
        <div class="input-line">
          <input name="name" type="text" value="{{actor.name}}" placeholder="캐릭터이름" />
        </div>
      </div>
    </div>

    <div class="id-left">
      <img class="id-logo" src="systems/aster/assets/aster-logo.png" alt="마녀와 채애의 아스테르" />
      <div class="id-div"></div>
      <div class="id-aff">
        <span class="aff-label">속성</span>
        <div class="id-affbox">
          <span class="aff-ico aff-ico--{{system.color}}"></span>
          <select name="system.color">
            {{selectOptions config.color selected=system.color localize=true}}
          </select>
        </div>
      </div>

      <div class="id-emblem id-emblem--{{system.color}}">로고</div>
    </div>

    <div class="portrait">
      <img src="{{actor.img}}" data-edit="img" title="{{actor.name}}" />
    </div>

    <div class="roll roll--wide">
      <div class="roll__row">
        <div class="seg">
          <label>
            <input type="radio" name="system.rollMode" value="normal" {{checked rollModeNormal}} />
            <span>일반</span>
          </label>
          <label>
            <input type="radio" name="system.rollMode" value="vs" {{checked rollModeVs}} />
            <span>대항</span>
          </label>
        </div>
        <div class="roll__target">
          <span class="lbl">목표</span>
          <span class="seal num"><input type="number" name="system.dc" value="{{system.dc}}" /></span>
        </div>
      </div>
      <button type="button" class="btn-cast" data-action="emoRoll" data-label="ASTER.emo.rollLabel">
        {{localize "ASTER.emo.roll"}}
      </button>
    </div>
  </div>
</section>

<section class="panel panel--abil" data-corner="❧">
  <div class="abil-grid">
    <div class="abil-col">
      <div class="panel__head">능력치</div>
      <div class="attrs">
        {{#each system.ability as |ability key|}}
        <div class="attr">
          <div class="attr__name abl-roll" data-action="ablRoll" data-ability="{{key}}" data-label="{{ability.label}}">
            {{ability.label}}
          </div>
          <div class="attr__main num">{{ability.total}}</div>
          <div class="attr__cells">
            <div class="cell num">
              <input type="number" name="system.ability.{{key}}.base" value="{{ability.base}}" />
            </div>
            <div class="cell cell--accent num">
              <input type="number" name="system.ability.{{key}}.mod" value="{{ability.mod}}" />
            </div>
          </div>
        </div>
        {{/each}}
      </div>
    </div>
    <div class="abil-col">
      <div class="panel__head">활력</div>
      <div class="vitals">
        <div class="gauge">
          <span class="gauge__lbl">건강</span>
          <div class="vessel">
            <div class="vessel__fill vessel__fill--hp" style="right: {{healthEmptyPct}}%"></div>
            <div class="vessel__txt num">
              <input type="number" name="system.health.value" value="{{system.health.value}}" />
              /
              <input type="number" name="system.health.max" value="{{system.health.max}}" />
            </div>
          </div>
        </div>
        <div class="gauge">
          <span class="gauge__lbl">포만도</span>
          <div class="vessel">
            <div class="vessel__fill vessel__fill--sat" style="right: {{satietyEmptyPct}}%"></div>
            <div class="vessel__txt num">
              <input type="number" name="system.satiety.value" value="{{system.satiety.value}}" />
              /
              <input type="number" name="system.satiety.max" value="{{system.satiety.max}}" />
            </div>
          </div>
        </div>
        <div class="minis">
          <div class="mini" {{tooltipHtml speedTooltip}}>
            <span class="k">민첩</span><span class="v num">{{system.speed}}</span>
          </div>
          <div class="mini"><span class="k">회피</span><span class="v num">{{system.dodge}}</span></div>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="panel panel--statel" data-corner="❀">
  <div class="panel__head">상태이상</div>
  <div class="status">
    <label class="herb-tag" {{tooltipHtml badstatusTips.injury}}>
      <input type="checkbox" name="system.badstatus.injury" {{checked system.badstatus.injury}} />
      {{localize "ASTER.badstatus.injury"}}
    </label>
    <label class="herb-tag" {{tooltipHtml badstatusTips.biginj}}>
      <input type="checkbox" name="system.badstatus.bigInj" {{checked system.badstatus.bigInj}} />
      {{localize "ASTER.badstatus.biginj"}}
    </label>
    <label class="herb-tag" {{tooltipHtml badstatusTips.sleepy}}>
      <input type="checkbox" name="system.badstatus.sleepy" {{checked system.badstatus.sleepy}} />
      {{localize "ASTER.badstatus.sleepy"}}
    </label>
    <label class="herb-tag" {{tooltipHtml badstatusTips.exhaustion}}>
      <input type="checkbox" name="system.badstatus.exhaustion" {{checked system.badstatus.exhaustion}} />
      {{localize "ASTER.badstatus.exhaustion"}}
    </label>
    <label class="herb-tag" {{tooltipHtml badstatusTips.hungry}}>
      <input type="checkbox" name="system.badstatus.hungry" {{checked system.badstatus.hungry}} />
      {{localize "ASTER.badstatus.hungry"}}
    </label>
  </div>

  <div class="panel__head panel__head--sub">아스테르</div>
  <div class="elements">
    {{#each system.aster as |aster key|}}
    <div class="el">
      <div class="el__head">
        <div class="el__dot el__dot--{{key}}"></div>
        <div class="el__name">{{aster.label}}</div>
        <div class="el__step">
          <span class="minus" data-action="asterStep" data-aster="{{key}}" data-dir="-1">-</span>
          <span class="plus" data-action="asterStep" data-aster="{{key}}" data-dir="1">+</span>
        </div>
      </div>
      <div class="el__val num"><input type="number" name="system.aster.{{key}}.value" value="{{aster.value}}" /></div>
    </div>
    {{/each}}
    <div class="el el--mat">
      <div class="el__head">
        <div class="el__dot el__dot--mat"></div>
        <div class="el__name">마테리얼</div>
      </div>
      <div class="el__val num"><input type="number" name="system.material" value="{{system.material}}" /></div>
    </div>
  </div>
</section>
