<div class="combat-tab">
  <div class="combat-ap-display">
    <span class="ap-label">{{localize "ASTER.combat.actionPoints"}}</span>
    <span class="ap-value">{{#if combatContext.inCombat}}{{combatContext.ap}}{{else}}—{{/if}}</span>
  </div>

  {{#unless combatContext.inCombat}}
  <div class="combat-disabled-notice">{{localize "ASTER.combat.notInCombat"}}</div>
  {{/unless}} {{!-- 회피는 액션이 아닌 반응 판정 — AP 소비 없음, 전투 진행 여부와 무관하게 활성 --}}
  <div class="combat-dodge">
    <button type="button" class="dodge-btn" data-action="rollDodge">
      <span class="dodge-label">{{localize "ASTER.dodge.label"}}</span>
      <span class="dodge-value">{{system.dodge}}</span>
    </button>
  </div>

  <div class="combat-actions {{#if combatContext.disabled}}disabled{{/if}}">
    <button
      type="button"
      class="action-btn"
      data-action="combatAction"
      data-action-key="throw"
      {{disabled
      combatContext.disabled}}
    >
      <span class="action-name">{{localize "ASTER.combat.action.throw"}}</span>
      <span class="action-cost">(1)</span>
    </button>
    <button
      type="button"
      class="action-btn {{#if combatContext.defendUsed}}used{{/if}}"
      data-action="combatAction"
      data-action-key="defend"
      {{disabled
      combatContext.disabled}}
      {{disabled
      combatContext.defendUsed}}
    >
      <span class="action-name">{{localize "ASTER.combat.action.defend"}}</span>
      <span class="action-cost">(2){{#if combatContext.defendUsed}} ✓{{/if}}</span>
    </button>
    <button
      type="button"
      class="action-btn"
      data-action="combatAction"
      data-action-key="focus"
      {{disabled
      combatContext.disabled}}
    >
      <span class="action-name">{{localize "ASTER.combat.action.focus"}}</span>
      <span class="action-cost">(3)</span>
    </button>
    <button
      type="button"
      class="action-btn"
      data-action="combatAction"
      data-action-key="dash"
      {{disabled
      combatContext.disabled}}
    >
      <span class="action-name">{{localize "ASTER.combat.action.dash"}}</span>
      <span class="action-cost">(X)</span>
    </button>
    <button
      type="button"
      class="action-btn {{#if combatContext.chargeUsed}}used{{/if}}"
      data-action="combatAction"
      data-action-key="charge"
      {{disabled
      combatContext.disabled}}
      {{disabled
      combatContext.chargeUsed}}
    >
      <span class="action-name">{{localize "ASTER.combat.action.charge"}}</span>
      <span class="action-cost">(3){{#if combatContext.chargeUsed}} ✓{{/if}}</span>
    </button>
    <button
      type="button"
      class="action-btn"
      data-action="combatAction"
      data-action-key="unisonPrepare"
      {{disabled
      combatContext.disabled}}
    >
      <span class="action-name">{{localize "ASTER.combat.action.unisonPrepare"}}</span>
      <span class="action-cost">(1)</span>
    </button>
  </div>
</div>
