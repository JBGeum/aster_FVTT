<form class="{{cssClass}} {{actor.type}} flexcol" autocomplete="off">
  <header class="sheet-header">
    <img class="profile-img" src="{{actor.img}}" data-edit="img" title="{{actor.name}}" height="100" width="100" />
    <div class="header-fields">
      <h1 class="charname"><input name="name" type="text" value="{{actor.name}}" placeholder="Name" /></h1>
      <div class="resources grid grid-3col">
        <div class="resource flex-group-center">
          <label class="resource-label">{{localize "ASTER.label.health"}}</label>
          <div class="resource-content flexrow flex-center flex-between">
            <input type="number" name="system.health.value" value="{{system.health.value}}" />
            <span> / </span>
            <input type="number" name="system.health.max" value="{{system.health.max}}" />
          </div>
        </div>
        <div class="resource flex-group-center">
          <label class="resource-label">CR</label>
          <input type="number" name="system.cr" value="{{system.cr}}" min="0" />
        </div>
        <div class="resource flex-group-center">
          <label class="resource-label">{{localize "ASTER.label.speed"}}</label>
          <input type="number" name="system.speed" value="{{system.speed}}" />
        </div>
      </div>
    </div>
  </header>

  <section class="sheet-body flexcol">
    <div class="npc-biography">
      {{editor system.biography target="system.biography" rollData=rollData button=true owner=owner editable=editable}}
    </div>

    <div class="npc-items">
      <ul class="items-list">
        {{#each items as |item|}}
        <li class="item-row" data-item-id="{{item._id}}">
          <img class="item-img" src="{{item.img}}" alt="{{item.name}}" width="24" height="24" />
          <span
            class="item-name"
            data-action="itemChat"
            data-item-id="{{item._id}}"
            title="{{localize 'ASTER.inventory.toChat'}}"
            >{{item.name}}</span
          >
          <button
            type="button"
            class="item-control"
            data-action="itemEdit"
            data-item-id="{{item._id}}"
            title="{{localize 'ASTER.inventory.edit'}}"
          >
            <i class="fas fa-pencil"></i>
          </button>
          <button
            type="button"
            class="item-control"
            data-action="itemDelete"
            data-item-id="{{item._id}}"
            title="{{localize 'ASTER.inventory.delete'}}"
          >
            <i class="fas fa-trash"></i>
          </button>
        </li>
        {{else}}
        <li class="items-empty">{{localize "ASTER.inventory.noItems"}}</li>
        {{/each}}
      </ul>
    </div>
  </section>
</form>
